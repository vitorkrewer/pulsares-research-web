  <text x="452" y="518" text-anchor="middle" fill="#5D645F" font-family="sans-serif" font-size="11.5">Figura 1 — Etapa preparatória da glicólise acoplada à hidrólise de ATP. Fonte: Elaborado pelo autor.</text>

