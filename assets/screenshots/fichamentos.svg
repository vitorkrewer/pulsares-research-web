  <text x="92" y="626" fill="#162722" font-family="Georgia, serif" font-size="14" font-style="italic">“O acoplamento de reações exergônicas e endergônicas por intermediários fosforilados constitui o eixo central da bioenergética celular” (LEHNINGER; NELSON, 2022, p. 498).</text>

