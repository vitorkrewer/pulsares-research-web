  <text x="452" y="274" text-anchor="middle" fill="#162722" font-family="Georgia, serif" font-size="19" font-style="italic">ΔG'° = − R · T · ln(K'_eq)  ⇒  ATP + H₂O ⇌ ADP + Pᵢ  (ΔG'° = −30,5 kJ/mol)</text>
