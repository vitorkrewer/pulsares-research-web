  <!-- AI Assistant Box -->
  <rect x="852" y="538" width="384" height="190" rx="8" fill="#162722"/>
  <text x="872" y="566" fill="#FF9E6D" font-family="sans-serif" font-size="12" font-weight="700">✦ ASSISTENTE DE PARÁFRASE (CONSENTIMENTO ATIVO)</text>
  <text x="872" y="592" fill="#E2ECE8" font-family="sans-serif" font-size="12">Síntese sugerida preservando a fonte original:</text>
  <text x="872" y="618" fill="#B5C4BE" font-family="Georgia, serif" font-size="12.5">Segundo Kleppmann et al. (2019, p. 14), a arquitetura local-first assegura autonomia operacional e perenidade ao acervo científico independentemente de servidores externos.</text>
  <rect x="872" y="684" width="166" height="28" rx="6" fill="#C96140"/>
  <text x="888" y="702" fill="#FFFFFF" font-family="sans-serif" font-size="11.5" font-weight="600">Inserir como Rascunho</text>
