  <text x="128" y="34" fill="#F7F3EB" font-family="Georgia, serif" font-size="15.5" font-weight="bold">Local-First Software: You Own Your Data (Kleppmann et al., 2019)</text>
  <rect x="690" y="14" width="136" height="30" rx="6" fill="#253E37"/>
  <text x="710" y="34" fill="#F7F3EB" font-family="sans-serif" font-size="12" font-weight="600">Página 14 de 32</text>
