  <text x="1164" y="386" fill="#5D645F" font-family="sans-serif" font-size="10.5" font-weight="700">Pág. 08</text>
  <text x="868" y="414" fill="#162722" font-family="sans-serif" font-size="13" font-weight="700">Comparação entre CRDTs e SQLite WAL Local</text>
  <text x="868" y="438" fill="#4A524D" font-family="sans-serif" font-size="12">Conectar este argumento com a seção 2.3 da dissertação sobre soberania de dados científicos.</text>
  <rect x="868" y="478" width="136" height="24" rx="6" fill="#EEF5F2"/>
