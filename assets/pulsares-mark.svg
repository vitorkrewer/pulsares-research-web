<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">Pulsares Research</title>
  <desc id="desc">Marca oficial do Pulsares Research: feixe de rádio astrofísico de um pulsar convergindo sobre as páginas abertas de um códice de pesquisa acadêmica.</desc>
  <defs>
    <!-- Gradiente do fundo circular: Verde Profundo Editorial -->
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#28433C"/>
      <stop offset="65%" stop-color="#1B2F29"/>
      <stop offset="100%" stop-color="#12201C"/>
    </radialGradient>

    <!-- Gradiente do feixe do pulsar: Terracota para Ambar suave -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8A65"/>
      <stop offset="45%" stop-color="#E25C38"/>
      <stop offset="100%" stop-color="#B84424"/>
    </linearGradient>

    <!-- Gradiente da página esquerda: Papel pergaminho luminoso -->
    <linearGradient id="pageLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6EE"/>
      <stop offset="85%" stop-color="#EADBCA"/>
      <stop offset="100%" stop-color="#D8C7B0"/>
    </linearGradient>

    <!-- Gradiente da página direita: Papel pergaminho com leve sombra editorial -->
    <linearGradient id="pageRightGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#F2E6D6"/>
      <stop offset="100%" stop-color="#DFCBB3"/>
    </linearGradient>

    <!-- Brilho do núcleo de nêutrons -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF5E5" stop-opacity="1"/>
      <stop offset="35%" stop-color="#FF9E6D" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#E25C38" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E25C38" stop-opacity="0"/>
    </radialGradient>

    <!-- Filtro de sombra sutil para profundidade de impressão de fólios -->
    <filter id="pageShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0B1411" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base circular -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)"/>

  <!-- Anel astronômico exterior (coordenadas celestes / astrolábio) -->
  <circle cx="256" cy="256" r="212" fill="none" stroke="#EADCCB" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="256" cy="256" r="198" fill="none" stroke="#EADCCB" stroke-opacity="0.08" stroke-dasharray="3 7" stroke-width="2"/>

  <!-- Linhas axiais de calibração científica -->
  <line x1="256" y1="36" x2="256" y2="52" stroke="#EADCCB" stroke-opacity="0.4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="256" y1="460" x2="256" y2="476" stroke="#EADCCB" stroke-opacity="0.4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="36" y1="256" x2="52" y2="256" stroke="#EADCCB" stroke-opacity="0.4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="460" y1="256" x2="476" y2="256" stroke="#EADCCB" stroke-opacity="0.4" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Órbitas de conhecimento / Ondas de radiofrequência elípticas -->
  <!-- Órbita superior inclinada -->
  <ellipse cx="256" cy="214" rx="164" ry="58" transform="rotate(-18 256 214)" fill="none" stroke="#EADCCB" stroke-opacity="0.22" stroke-width="2"/>
  <path d="M 122 250 A 164 58 0 0 1 386 172" transform="rotate(-18 256 214)" fill="none" stroke="#F4EDE1" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>

  <!-- Órbita inferior de ancoragem de pesquisa -->
  <ellipse cx="256" cy="226" rx="172" ry="64" transform="rotate(22 256 226)" fill="none" stroke="#E25C38" stroke-opacity="0.28" stroke-width="2.5"/>
  <path d="M 104 226 A 172 64 0 0 0 408 238" transform="rotate(22 256 226)" fill="none" stroke="#FF7E55" stroke-opacity="0.85" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Nodos estelares na órbita (fontes e citações conectadas) -->
  <circle cx="106" cy="284" r="5" fill="#FAF6EE" stroke="#1B2F29" stroke-width="1.5"/>
  <circle cx="414" cy="232" r="4" fill="#FF8A65" stroke="#1B2F29" stroke-width="1.5"/>
  <circle cx="368" cy="142" r="3" fill="#EADCCB" stroke-opacity="0.9"/>

  <!-- Feixe colimado do Pulsar (cone de emissão relavística) -->
  <path d="M 256 206 L 241 82 L 271 82 Z" fill="url(#beamGrad)" opacity="0.32"/>
  <path d="M 256 206 L 246 102 L 266 102 Z" fill="#FF8A65" opacity="0.6"/>

  <!-- ================= PÁGINAS ABERTAS / CÓDICE ACADÊMICO ================= -->
  <g filter="url(#pageShadow)">
    <!-- Fólio Esquerdo -->
    <path d="M 256 314 
             C 214 278, 154 276, 108 296 
             C 104 298, 100 302, 100 307 
             L 100 382 
             C 100 387, 104 391, 109 389 
             C 152 370, 212 372, 256 406 
             Z" 
          fill="url(#pageLeftGrad)"/>

    <!-- Fólio Direito -->
    <path d="M 256 314 
             C 298 278, 358 276, 404 296 
             C 408 298, 412 302, 412 307 
             L 412 382 
             C 412 387, 408 391, 403 389 
             C 360 370, 300 372, 256 406 
             Z" 
          fill="url(#pageRightGrad)"/>

    <!-- Linhas de texto impressas/estudadas no fólio esquerdo (destaques e anotações) -->
    <path d="M 136 322 C 168 308, 204 310, 234 326" fill="none" stroke="#8A7661" stroke-opacity="0.4" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 134 340 C 166 326, 202 328, 234 344" fill="none" stroke="#D45D3A" stroke-opacity="0.85" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 138 358 C 168 345, 202 347, 234 362" fill="none" stroke="#8A7661" stroke-opacity="0.4" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Linhas de texto impressas no fólio direito -->
    <path d="M 278 326 C 308 310, 344 308, 376 322" fill="none" stroke="#8A7661" stroke-opacity="0.4" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 278 344 C 308 328, 344 326, 376 340" fill="none" stroke="#8A7661" stroke-opacity="0.4" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 278 362 C 308 347, 344 345, 374 358" fill="none" stroke="#8A7661" stroke-opacity="0.3" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Lombada / Vinco central do livro -->
    <path d="M 256 312 L 256 407" fill="none" stroke="#253832" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Feixe descendente ligando o pulsar ao texto do livro -->
  <line x1="256" y1="218" x2="256" y2="308" stroke="#FF7E55" stroke-width="2" stroke-opacity="0.55" stroke-dasharray="4 4"/>

  <!-- ================= ESTRELA DE NÊUTRONS / PULSAR CENTRAL ================= -->
  <!-- Halo radiante exterior -->
  <circle cx="256" cy="208" r="44" fill="url(#coreGlow)"/>

  <!-- Feixe estelar geométrico de quatro pontas principais colimadas -->
  <path d="M 256 142 
           C 257 182, 266 205, 322 208 
           C 266 211, 257 234, 256 274 
           C 255 234, 246 211, 190 208 
           C 246 205, 255 182, 256 142 Z" 
        fill="url(#beamGrad)"/>

  <!-- Pontas secundárias diagonais da pulsação científica -->
  <path d="M 256 172 
           C 257 194, 263 204, 292 208 
           C 263 212, 257 222, 256 244 
           C 255 222, 249 212, 220 208 
           C 249 204, 255 194, 256 172 Z" 
        fill="#FF9E6D" 
        transform="rotate(45 256 208)"/>

  <!-- Núcleo atômico de luz de nêutrons de alta intensidade -->
  <circle cx="256" cy="208" r="10" fill="#FFFBF5"/>
  <circle cx="256" cy="208" r="5" fill="#FFFFFF"/>
</svg>
